name: Prepare branded link preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/brand-preview-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Prepare verified branding commit (do not update main)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, re, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          assert repo == 'Tslyme1/hochu-landing'
          api_root = 'https://api.github.com/repos/' + repo
          def api(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api_root + path, data=body, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'hochu-branding-build'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def source(path):
              result = api('/contents/' + path + '?ref=' + parent)
              assert result['encoding'] == 'base64'
              return base64.b64decode(result['content'])
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          old = source('index.html')
          html = old.decode('utf-8')
          assert 'property="og:image"' not in html and "property='og:image'" not in html
          logo_path = 'assets/images/7cf432b599e2f63310.webp'
          logo_bytes = source(logo_path)
          logo = Image.open(io.BytesIO(logo_bytes)).convert('RGBA')
          def square(size, opaque=False):
              image = Image.new('RGBA', (size, size), (255,255,255,255) if opaque else (0,0,0,0))
              mark = ImageOps.contain(logo, (size,size), method=Image.Resampling.LANCZOS)
              image.alpha_composite(mark, ((size-mark.width)//2, (size-mark.height)//2))
              return image.convert('RGB') if opaque else image
          def png(image):
              out = io.BytesIO()
              image.save(out, format='PNG', optimize=True)
              return out.getvalue()
          files = {
              'assets/brand/hochu-share-logo-v1.png': png(square(512, True)),
              'assets/brand/apple-touch-icon-v1.png': png(square(180, True)),
              'assets/brand/favicon-32-v1.png': png(square(32)),
          }
          out = io.BytesIO()
          square(48).save(out, format='ICO', sizes=[(16,16),(32,32),(48,48)])
          files['favicon.ico'] = out.getvalue()
          preview = 'https://tslyme1.github.io/hochu-landing/assets/brand/hochu-share-logo-v1.png'
          title = 'Хочу — жизнь вашего города'
          description = 'Хочу — весь досуг в одном приложении: события на карте и в ленте, подборки блогеров и сообществ, чаты с друзьями и билеты.'
          tags = [
              '<!-- Branded icons and social previews: available without JavaScript. -->',
              '<link rel="icon" href="favicon.ico?v=brand-1" sizes="16x16 32x32 48x48" type="image/x-icon"/>',
              '<link rel="icon" href="assets/brand/favicon-32-v1.png" sizes="32x32" type="image/png"/>',
              '<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon-v1.png" sizes="180x180"/>',
              '<meta property="og:type" content="website"/>',
              '<meta property="og:locale" content="ru_RU"/>',
              '<meta property="og:site_name" content="Хочу"/>',
              '<meta property="og:title" content="' + title + '"/>',
              '<meta property="og:description" content="' + description + '"/>',
              '<meta property="og:url" content="https://tslyme1.github.io/hochu-landing/"/>',
              '<meta property="og:image" content="' + preview + '"/>',
              '<meta property="og:image:secure_url" content="' + preview + '"/>',
              '<meta property="og:image:type" content="image/png"/>',
              '<meta property="og:image:width" content="512"/>',
              '<meta property="og:image:height" content="512"/>',
              '<meta property="og:image:alt" content="Логотип приложения Хочу"/>',
              '<meta name="twitter:card" content="summary"/>',
              '<meta name="twitter:title" content="' + title + '"/>',
              '<meta name="twitter:description" content="' + description + '"/>',
              '<meta name="twitter:image" content="' + preview + '"/>',
              '<meta name="twitter:image:alt" content="Логотип приложения Хочу"/>',
          ]
          needle = '<link href="' + logo_path + '" rel="icon" type="image/webp"/>'
          assert html.count(needle) == 1, 'Icon markup changed; stop rather than rewrite unrelated HTML.'
          updated = html.replace(needle, '\n'.join(tags) + '\n', 1)
          assert updated.split('</head>', 1)[1] == html.split('</head>', 1)[1]
          files['index.html'] = updated.encode('utf-8')
          dimensions = {}
          for path, data in files.items():
              assert len(data) < 1024 * 1024
              if path.endswith(('.png','.ico')):
                  image = Image.open(io.BytesIO(data)); image.load()
                  dimensions[path] = list(image.size)
          output = Path('brand-output'); output.mkdir()
          entries, hashes = [], {}
          for path, data in files.items():
              expected = blob_sha(data)
              result = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding':'base64'})
              assert result['sha'] == expected
              hashes[path] = expected
              entries.append({'path':path, 'mode':'100644', 'type':'blob', 'sha':expected})
              dest = output/path; dest.parent.mkdir(parents=True, exist_ok=True); dest.write_bytes(data)
          # Remove only this temporary helper in the prepared commit. All other files stay intact.
          entries.append({'path':'.github/workflows/brand-preview-once.yml', 'mode':'100644', 'type':'blob', 'sha':None})
          base_tree = api('/git/commits/' + parent)['tree']['sha']
          tree = api('/git/trees', {'base_tree':base_tree, 'tree':entries})['sha']
          result = api('/git/commits', {
              'message':'Use Hochu logo in link previews, favicons and iOS home-screen icons\n\nAdd static Open Graph and summary card metadata with an absolute PNG logo URL. Convert the existing approved logo to PNG and ICO without redrawing it. Preserve all body markup, styles, scripts, videos and product copy. Remove the temporary asset-preparation workflow. Uploaded blob hashes and image dimensions were verified before preparing this commit.',
              'tree':tree, 'parents':[parent]})
          report = {'base_sha':parent,'commit_sha':result['sha'],'tree_sha':tree,
                    'files':hashes,'dimensions':dimensions,'body_unchanged':True,
                    'original_html_sha':blob_sha(old),'logo_source_sha':blob_sha(logo_bytes)}
          (output/'verification.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print('BRAND_RESULT=' + json.dumps(report, ensure_ascii=False))
      - name: Save verified assets and prepared commit ID
        uses: actions/upload-artifact@v4
        with:
          name: branded-preview-ready
          path: brand-output/
          retention-days: 1
